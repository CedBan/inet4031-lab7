apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-exporter
  labels:
    app: db-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db-exporter
  template:
    metadata:
      labels:
        app: db-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
      - name: db-exporter
        image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
        ports:
        - containerPort: 9187
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_DB
        - name: DATA_SOURCE_URI
          value: "db:5432/$(POSTGRES_DB)?sslmode=disable"
        - name: DATA_SOURCE_USER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_USER
        - name: DATA_SOURCE_PASS
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: POSTGRES_PASSWORD
        readinessProbe:
          httpGet:
            path: /
            port: 9187
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: db-exporter
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
spec:
  selector:
    app: db-exporter
  ports:
  - port: 9187
    targetPort: 9187
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-clients
spec:
  podSelector:
    matchLabels:
      app: db
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: web
    - podSelector:
        matchLabels:
          app: db-exporter
    ports:
    - protocol: TCP
      port: 5432
