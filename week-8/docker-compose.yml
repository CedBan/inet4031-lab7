version: '3.8'

services:
  web:
    build: .
    container_name: hardened-web-app
    restart: always
    ports:
      - "8080:8080"
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
